name: NoteTaker
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: macosx
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.6
  AudioPipeline:
    path: Packages/AudioPipeline
targets:
  NoteTaker:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NoteTaker
      - path: Shared
    dependencies:
      - package: AudioPipeline
      - package: FluidAudio
    entitlements:
      path: NoteTaker/Resources/NoteTaker.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: NoteTaker/Resources/Info.plist
      properties:
        CFBundleDisplayName: AI-NoteTaker
        CFBundleIdentifier: com.seonwoo.notetaker
        CFBundleName: AI-NoteTaker
        CFBundleShortVersionString: "1.3.2"
        CFBundleVersion: "9"
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: AI-NoteTaker needs microphone access to record your voice.
        NSAudioCaptureUsageDescription: AI-NoteTaker needs system audio access to record meeting audio.
        NSSpeechRecognitionUsageDescription: AI-NoteTaker uses speech recognition to create transcripts.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: AI-NoteTaker
        PRODUCT_BUNDLE_IDENTIFIER: com.seonwoo.notetaker
        PRODUCT_MODULE_NAME: NoteTaker
        PRODUCT_NAME: AI-NoteTaker
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  NoteTakerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NoteTakerTests
    dependencies:
      - target: NoteTaker
    info:
      path: NoteTakerTests/Info.plist
      properties:
        CFBundleIdentifier: com.seonwoo.notetaker.tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seonwoo.notetaker.tests
        PRODUCT_NAME: NoteTakerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AI-NoteTaker.app/Contents/MacOS/AI-NoteTaker"
  NoteTakerUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NoteTakerUITests
    dependencies:
      - target: NoteTaker
    info:
      path: NoteTakerUITests/Info.plist
      properties:
        CFBundleIdentifier: com.seonwoo.notetaker.uitests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seonwoo.notetaker.uitests
        PRODUCT_NAME: NoteTakerUITests
schemes:
  NoteTaker:
    build:
      targets:
        NoteTaker: all
        NoteTakerTests: [test]
        NoteTakerUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - NoteTakerTests
        - NoteTakerUITests
    run:
      config: Debug
